[bar.default]
position = "top"
margin_edge = 0
margin_ends = 0
background_opacity = 0.93
thickness = 35
widget_spacing = 6
start = ["launcher", "menu_gap", "active_window"]
center = ["workspaces"]
end = ["media", "tray", "network", "privacy", "battery", "volume", "brightness", "notifications", "control-center", "clock_left_gap", "clock"]

[widget.launcher]
glyph = "brand-finder"
custom_image = "/usr/share/icons/cachyos.svg"
scale = 1.6
capsule_padding = 0

[widget.launcher.actions]
left = "panel-toggle session"
right = "panel-toggle launcher"

[widget.menu_gap]
type = "spacer"
length = 8

[widget.clock_left_gap]
type = "spacer"
length = 8

[widget.clock.actions]
left = "panel-toggle control-center notifications"

[shell]
font_family = "Adwaita Sans"

[shell.launcher]
layout = "full"
default_view = "all"
app_grid = true
categories = true
sort_by_usage = true
search_position = "bottom"
show_session_button = true

[shell.panel]
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
session_placement = "floating"
session_position = "center"

[dock]
enabled = true
position = "bottom"
auto_hide = false
reserve_space = true
margin_edge = 0
margin_ends = 0
icon_size = 32
main_axis_padding = 0
cross_axis_padding = 0
item_spacing = 0
show_running = true
show_dots = true
magnification = true
launcher_position = "start"

[theme]
mode = "dark"
source = "builtin"
builtin = "Kanagawa"
